<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shivjyoti Dry Fruits</title>
<style>
:root{--bg:#f7f3e8;--card:#fffdf7;--ink:#2e2514;--mut:#7d6e52;--line:#e7dcc0;--gold:#a8802a;--goldbg:#f1e6c6;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171310;--card:#211b14;--ink:#f3ead7;--mut:#b5a58a;--line:#3a3023;--gold:#d9ac4a;--goldbg:#33291a;--on:#171310}}
:root[data-theme="dark"]{--bg:#171310;--card:#211b14;--ink:#f3ead7;--mut:#b5a58a;--line:#3a3023;--gold:#d9ac4a;--goldbg:#33291a;--on:#171310}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;height:54px;background:var(--card);border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px;padding:0 14px 0 10px;box-shadow:0 2px 8px rgba(60,40,10,.08)}
.burger{width:44px;height:44px;border:0;background:none;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger:hover,.burger:active{background:var(--goldbg)}
.burger:focus-visible,.item:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.burger i{display:block;width:22px;height:2.5px;border-radius:2px;background:var(--gold)}
.title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{position:fixed;top:calc(57px + env(safe-area-inset-top,0px));left:0;right:0;bottom:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
.scrim{position:fixed;inset:0;background:rgba(30,20,5,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);z-index:40;background:var(--card);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .22s;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.brand{background:var(--goldbg);border-bottom:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 16px;text-align:center}
.brand img{max-width:100%;height:84px;object-fit:contain;display:block;margin:0 auto}
.brand p{margin:8px 0 0;font-size:12px;color:var(--mut)}
.menu{padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.item{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;text-align:left;padding:13px 12px;border-radius:12px;cursor:pointer;margin-bottom:4px}
.item .ic{font-size:20px;width:26px;text-align:center}
.item:hover{background:var(--goldbg)}
.item.sel{background:var(--gold);color:var(--on);font-weight:600}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.sep{margin:14px 12px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.view{position:absolute;inset:0;overflow:auto;padding:14px;display:none;box-sizing:border-box}
.view.on{display:block}
.view h2{margin:4px 0 10px;font-size:18px;color:var(--gold)}
.view h3{margin:18px 0 8px;font-size:15px;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mut)}
.card2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card2 .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card2 .meta{font-size:12px;color:var(--mut)}
.card2.x{opacity:.55}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--goldbg);color:var(--gold);margin:2px 4px 0 0}
.tag.bad{background:#fde8e6;color:#b3261e}
.vt{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vt th{background:var(--goldbg);text-align:left;padding:8px;font-size:12px}
.vt td{padding:6px 8px;border-top:1px solid var(--line)}
.vt input,.rec input,.vsel{width:84px;font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);box-sizing:border-box}
.vsel{width:auto}
.neg{color:#b3261e;font-weight:700}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.vt input[type=color]{width:42px;height:32px;padding:2px}.vt input.cn{width:92px}
.sl{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.vb{font:inherit;font-weight:600;background:var(--gold);color:var(--on);border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.vb.alt{background:var(--goldbg);color:var(--gold)}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:8px}
.rec label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.note2{font-size:12px;color:var(--mut);margin:6px 0}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fbf8f1;--card:#fff;--ink:#2b2112;--mut:#857453;--line:#ecdfc0;--gold:#a97c1f;--goldbg:#f7efd9;--on:#fff;color-scheme:light}

.bar{background:#fff;border-bottom:0;box-shadow:0 6px 20px rgba(169,124,31,.10)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#8a6314,#cfa94f,#a97c1f,#cfa94f,#8a6314)}
.title{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:700;color:#5a410d;flex:1}
.blogo{height:36px;width:auto;margin-left:auto;flex:none}
.item.sel{background:linear-gradient(135deg,#cfa94f 0%,#a97c1f 55%,#8a6314 100%);color:#fff;box-shadow:0 3px 10px rgba(169,124,31,.3)}
.brand{background:linear-gradient(180deg,#fff,#f7efd9)}
.brand img{height:90px}
.view h2,.view h3{font-family:"Playfair Display",Georgia,"Times New Roman",serif;color:#8a6314}
.stat{border-top:3px solid #c9a24a;box-shadow:0 4px 16px rgba(169,124,31,.08)}
.card2{box-shadow:0 4px 16px rgba(169,124,31,.07);border-radius:14px}
.vb{background:linear-gradient(135deg,#cfa94f 0%,#a97c1f 55%,#8a6314 100%);color:#fff}.vb.alt{background:#fff;color:#8a6314;border:1px solid var(--line)}
.vt th{background:#f7efd9;color:#6b4d10;text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.tag{background:#f7efd9;color:#8a6314}.tag.bad{background:#fde8e6;color:#b3261e}
.vt input,.rec input,.vsel{background:#fff}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);margin:8px 0}.fl input,.fl select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:340px}
.card2 b{color:#8a6314}

nlet items = [];\ntry { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { items = []; }\n\nconst $ = id => document.getElementById(id);\nconst fmt = n => \"\u20b9\" + Number(n).toLocaleString(\"en-IN\", {maximumFractionDigits: 2});\nconst save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };\nconst today = () => new Date().toISOString().slice(0, 10);\nconst esc = s => String(s).replace(/[&<>\"']/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\n\n$(\"date\").value = today();\n\nfunction toggleBank() { $(\"bankWrap\").classList.toggle(\"hidden\", $(\"mode\").value === \"Cash\"); }\n$(\"mode\").addEventListener(\"change\", toggleBank);\ntoggleBank();\n$(\"cat\").addEventListener(\"change\", () => { $(\"catOther\").style.display = $(\"cat\").value === \"Other\" ? \"block\" : \"none\"; });\n\nfunction buildMonths(keep) {\n  const set = new Set(items.map(i => i.date.slice(0, 7)));\n  set.add(today().slice(0, 7));\n  const months = [...set].sort().reverse();\n  $(\"month\").innerHTML = '<option value=\"all\">All months<\/option>' +\n    months.map(m => {\n      const label = new Date(m + \"-01\").toLocaleString(\"en-IN\", {month: \"long\", year: \"numeric\"});\n      return `<option value=\"${m}\">${label}<\/option>`;\n    }).join(\"\");\n  $(\"month\").value = keep && (keep === \"all\" || months.includes(keep)) ? keep : today().slice(0, 7);\n}\n\nfunction group(list, key) {\n  const m = {};\n  list.forEach(i => { const k = i[key] || \"\u2014\"; m[k] = (m[k] || 0) + i.amount; });\n  return Object.entries(m).sort((a, b) => b[1] - a[1]);\n}\n\nfunction drawGroup(el, entries, total) {\n  el.innerHTML = entries.length ? entries.map(([k, v]) =>\n    `<div class=\"row\"><span>${esc(k)}<\/span><strong>${fmt(v)}<\/strong><\/div>\n     <div class=\"track\"><div class=\"fill\" style=\"width:${total ? (v / total * 100) : 0}%\"><\/div><\/div>`).join(\"\")\n    : '<div class=\"empty\">Nothing yet<\/div>';\n}\n\nfunction render() {\n  const m = $(\"month\").value;\n  const list = items.filter(i => m === \"all\" || i.date.startsWith(m))\n                    .sort((a, b) => b.date.localeCompare(a.date));\n  const total = list.reduce((s, i) => s + i.amount, 0);\n  $(\"total\").textContent = fmt(total);\n  drawGroup($(\"byCat\"), group(list, \"cat\"), total);\n  drawGroup($(\"byMode\"), group(list, \"mode\"), total);\n  drawGroup($(\"byBank\"), group(list.filter(i => i.bank), \"bank\"), total);\n  $(\"rows\").innerHTML = list.map(i =>\n    `<tr><td>${esc(i.date)}<\/td><td>${esc(i.desc)}<\/td><td>${esc(i.cat)}<\/td><td>${esc(i.mode)}<\/td>\n     <td>${esc(i.bank || \"\u2014\")}<\/td><td class=\"amt\">${fmt(i.amount)}<\/td><td class=\"note\">${esc(i.note || \"\")}<\/td>\n     <td><button class=\"del\" data-id=\"${i.id}\" aria-label=\"Delete ${esc(i.desc)}\">Delete<\/button><\/td><\/tr>`).join(\"\");\n  $(\"empty\").classList.toggle(\"hidden\", list.length > 0);\n}\n\n$(\"add\").addEventListener(\"click\", () => {\n  const amount = parseFloat($(\"amount\").value);\n  const desc = $(\"desc\").value.trim();\n  const mode = $(\"mode\").value;\n  const bank = $(\"bank\").value.trim();\n  if (!$(\"date\").value) return $(\"msg\").textContent = \"Pick a date.\";\n  if (!desc) return $(\"msg\").textContent = \"Add a description.\";\n  if (!(amount > 0)) return $(\"msg\").textContent = \"Enter an amount above 0.\";\n  if (mode !== \"Cash\" && !bank) return $(\"msg\").textContent = \"Enter the bank name for \" + mode + \".\";\n  $(\"msg\").textContent = \"\";\n  items.push({\n    id: Date.now() + Math.random().toString(16).slice(2),\n    date: $(\"date\").value, desc, cat: $(\"cat\").value === \"Other\" ? ($(\"catOther\").value.trim() || \"Other\") : $(\"cat\").value, amount, mode,\n    bank: mode === \"Cash\" ? \"\" : bank, note: $(\"note\").value.trim()\n  });\n  save();\n  $(\"desc\").value = \"\"; $(\"catOther\").value = \"\"; $(\"amount\").value = \"\"; $(\"note\").value = \"\";\n  buildMonths($(\"month\").value);\n  render();\n  $(\"desc\").focus();\n});\n\n$(\"rows\").addEventListener(\"click\", e => {\n  const id = e.target.dataset && e.target.dataset.id;\n  if (!id) return;\n  items = items.filter(i => i.id !== id);\n  save();\n  buildMonths($(\"month\").value);\n  render();\n});\n\nfunction csvCell(v) {\n  let s = String(v == null ? \"\" : v);\n  if (/^[=+\\-@]/.test(s)) s = \"'\" + s;\n  return '\"' + s.replace(/\"/g, '\"\"') + '\"';\n}\n\n$(\"export\").addEventListener(\"click\", async () => {\n  const m = $(\"month\").value;\n  const list = items.filter(i => m === \"all\" || i.date.startsWith(m))\n                    .sort((a, b) => a.date.localeCompare(b.date));\n  const msg = $(\"exportMsg\");\n  if (!list.length) { msg.textContent = \"No expenses to export for this selection.\"; return; }\n  const head = [\"Date\", \"Description\", \"Category\", \"Amount (INR)\", \"Payment mode\", \"Bank\", \"Note\"];\n  const lines = [head.map(csvCell).join(\",\")].concat(list.map(i =>\n    [csvCell(i.date), csvCell(i.desc), csvCell(i.cat), i.amount, csvCell(i.mode), csvCell(i.bank), csvCell(i.note)].join(\",\")));\n  lines.push([\"\", \"\", \"Total\", list.reduce((s, i) => s + i.amount, 0), \"\", \"\", \"\"].map(csvCell).join(\",\"));\n  const text = \"\\ufeff\" + lines.join(\"\\r\\n\");\n  const filename = \"expenses-\" + (m === \"all\" ? \"all\" : m) + \".csv\";\n  msg.textContent = \"\";\n  try {\n    if (window.claude && typeof window.claude.use === \"function\") {\n      const dl = await window.claude.use(\"downloads\");\n      if (!dl) { msg.textContent = \"Export isn't available in this view.\"; return; }\n      await dl.save({ filename, data: text });\n    } else {\n      const url = URL.createObjectURL(new Blob([text], { type: \"text/csv;charset=utf-8\" }));\n      const a = document.createElement(\"a\");\n      a.href = url; a.download = filename;\n      document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 1000);\n    }\n    msg.textContent = \"Exported \" + list.length + \" expense\" + (list.length > 1 ? \"s\" : \"\") + \".\";\n  } catch (e) {\n    if (!e || e.code !== \"declined\") msg.textContent = \"Couldn't save the file. Try again.\";\n  }\n});\n\n$(\"month\").addEventListener(\"change\", render);\nbuildMonths();\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "prashna": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Shree Ganesh \u2013 Mahalaxami Prashna<\/title>\n<style>\n:root{--bg:#fbf7ee;--card:#fff;--ink:#2b2118;--mut:#7a6a58;--line:#e6dcc8;--acc:#b4540a;--head:#f3e6c8;--neg:#c0392b;--pos:#1e7a46;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1a1510;--card:#241d16;--ink:#f1e8d8;--mut:#b3a490;--line:#3b3025;--acc:#f0a050;--head:#33281b;--neg:#ff7b6b;--pos:#6fd29a}}\n:root[data-theme=\"dark\"]{--bg:#1a1510;--card:#241d16;--ink:#f1e8d8;--mut:#b3a490;--line:#3b3025;--acc:#f0a050;--head:#33281b;--neg:#ff7b6b;--pos:#6fd29a}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;padding:16px}\nh1{margin:0;text-align:center;font-size:20px;color:var(--acc)}\n.sub{text-align:center;color:var(--mut);margin:2px 0 14px;font-size:13px}\nh2{font-size:14px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}\n.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}\n.rates label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}\ninput{font:inherit; ction(a,x){return a+x.g},0)}\nfunction vlabel(v){return v===\"A\"?\"Anjeer\":v===\"P\"?\"Pista\":\"\"}\nfunction itemsFor(p,v){if(p.kind===\"box4\"){var g=p.g;return[{k:\"kaju\",g:g},{k:\"badam\",g:g},{k:\"kish\",g:g},{k:v===\"P\"?\"pista\":\"anj\",g:g}]}return p.items}\nfunction kindLabel(p){return({jar2:\"2 Jar\",jar3:\"3 Jar\",jar4:\"4 Jar\",jar5:\"5 Jar\"})[p.kind]||\"\"}\nfunction gramLabel(p){return p.kind===\"box4\"?p.g+\" Gram\":!p.items?kindLabel(p)+\" \u00b7 \"+p.g+\" Gram each\":(kindLabel(p)?kindLabel(p)+\" \u00b7 \":\"\")+totalG(p.items)+\" Gram\"}\nfunction rowsOf(p){return p.kind===\"box4\"?Object.keys(p.vars).sort().map(function(v){return{p:p,v:v,po:p.vars[v]}}):[{p:p,v:\"\",po:p,dyn:!p.items}]}\nfunction mkBox4(base,g,q){return{id:uid(),base:base,kind:\"box4\",g:g,name:base+\" \"+g+\"g\",box:q.box||0,pack:q.pack||0,vars:{A:{bulk:0,single:0},P:{bulk:0,single:0}}}}\nfunction saveProducts(a){try{localStorage.setItem(PK,JSON.stringify(a))}catch(e){}}\nfunction readKey(k){try{return JSON.parse(localStorage.getItem(k)||\"null\")}catch(e){return null}}\nfunction seedV1(){var BD=[[\"1-A 50\",50,\"A\",37,10,250,280],[\"1-P 50\",50,\"P\",37,10,300,330],[\"2-A 50\",50,\"A\",65,10,330,350],[\"2-P 50\",50,\"P\",65,10,350,380],[\"2-A 75\",75,\"A\",65,10,400,420],[\"2-P 75\",75,\"P\",65,10,470,500],[\"3-A 100\",100,\"A\",65,10,500,550],[\"3-P 100\",100,\"P\",65,10,600,650],[\"4-A 150\",150,\"A\",95,10,750,780],[\"4-P 150\",150,\"P\",95,10,850,900],[\"7-A 150\",150,\"A\",350,30,1200,1250],[\"7-P 150\",150,\"P\",350,30,1300,1350],[\"7-A 180\",180,\"A\",350,30,1300,1350],[\"7-P 180\",180,\"P\",350,30,1450,1500]];var sv=readKey(\"dfprice_v2\");\n var hd=(sv&&sv.hidden)||[],cu=(sv&&sv.custom)||[],rows=(sv&&sv.rows)||[];\n var bs=BD.filter(function(r){return hd.indexOf(r[0])<0}),ok=!!(sv&&rows.length===bs.length+cu.length),list=[];\n bs.forEach(function(r,i){var q=ok?rows[i]:{box:r[3],pack:r[4],bulk:r[5],single:r[6]};list.push({name:r[0],kind:\"box4\",v:r[2],g:r[1],box:
